name: sig-osm
on:
  push:
    branches: [sig-fuentes]
    paths: [fuentes/osm/consultas.txt, fuentes/crawl.py]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: OpenStreetMap (Overpass)
        run: |
          grep -v '^#' fuentes/osm/consultas.txt | while IFS=$'\t' read -r name q; do
            [ -z "$name" ] && continue
            for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              curl -sS -m 600 --data-urlencode "data=$q" "$ep" -o "fuentes/osm/$name.json" && python3 -c "import json,sys;d=json.load(open('fuentes/osm/$name.json'));print('$name',len(d['elements']))" && break
            done
            gzip -f "fuentes/osm/$name.json" || true
            sleep 5
          done
          ls -la fuentes/osm
      - name: PMDU Huixquilucan (SEDUI Edomex)
        continue-on-error: true
        run: |
          timeout 900 python3 fuentes/crawl.py "https://sedui.edomex.gob.mx/huixquilucan" "E-?0?2|PMDU|huix" fuentes/edomex || true
          ls -la fuentes/edomex || true
      - name: Guardar
        run: |
          cd fuentes; for f in $(find . -size +90M -type f); do split -b 80m "$f" "$f.part-"; rm "$f"; done; cd ..
          git config user.name "sig-bot"; git config user.email "salo@asteriacapital.org"
          git add fuentes; git commit -m "OSM y PMDU Huixquilucan" || true
          git pull --rebase -q || true
          git push
